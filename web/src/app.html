<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="happyDeliver - Test Your Email Deliverability" />
        <meta
            property="og:description"
            content="Get detailed insights into your email configuration, authentication, spam score, and more. Open-source, self-hosted, and privacy-focused."
        />
        <meta property="og:image" content="/img/og.webp" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="happyDeliver - Test Your Email Deliverability" />
        <meta
            name="twitter:description"
            content="Get detailed insights into your email configuration, authentication, spam score, and more. Open-source, self-hosted, and privacy-focused."
        />
        <meta name="twitter:image" content="/img/og.webp" />

        <script>
            // Ensure window.fetch has a setter in iframe/sandboxed environments
            // where window.fetch or Window.prototype.fetch only provides a getter.
            (function () {
                try {
                    var win = typeof window !== "undefined" ? window : globalThis;
                    if (!win) return;
                    var origFetch = win.fetch ? win.fetch.bind(win) : undefined;
                    var activeFetch = origFetch;

                    try {
                        Object.defineProperty(win, "fetch", {
                            get: function () {
                                return activeFetch;
                            },
                            set: function (newFetch) {
                                activeFetch = newFetch;
                            },
                            configurable: true,
                            enumerable: true,
                        });
                    } catch (e1) {
                        try {
                            if (typeof Window !== "undefined" && Window.prototype) {
                                Object.defineProperty(Window.prototype, "fetch", {
                                    get: function () {
                                        return activeFetch;
                                    },
                                    set: function (newFetch) {
                                        activeFetch = newFetch;
                                    },
                                    configurable: true,
                                    enumerable: true,
                                });
                            }
                        } catch (e2) {}
                    }
                } catch (e) {}
            })();
        </script>

        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <script>
            // Apply theme before render to prevent flash
            (function () {
                const stored = localStorage.getItem("theme");
                const theme =
                    stored ||
                    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                document.documentElement.setAttribute("data-bs-theme", theme);
            })();
        </script>
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
